<!DOCTYPE html>
<html lang="lt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3a0a20" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coach Vilma" />
    <meta name="description" content="Coach Vilma treniruočių programėlė" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon"  href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />

    <!-- PWA ikonos -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <title>Coach Vilma</title>
    <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: calc(var(--app-vh, 1vh) * 100); }
  body { height: calc(var(--app-vh, 1vh) * 100); background: #3a0a20; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  #root { height: 100%; overflow-y: auto; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
</style>
    <script>
      (function () {
        function setAppVh() {
          document.documentElement.style.setProperty("--app-vh", (window.innerHeight * 0.01) + "px");
        }
        setAppVh();
        window.addEventListener("resize", setAppVh);
        window.addEventListener("orientationchange", setAppVh);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", setAppVh);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
